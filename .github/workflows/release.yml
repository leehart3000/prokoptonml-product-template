name: Release

# A v* tag releases the product: deploy the API (Cloud Run), then record a
# GitHub Release.
#   pixi run release v1.0.0   (checks first, then tags and waits)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04 # Pinned; move to a newer image on purpose
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The tags and main, for the checks
          persist-credentials: false
      # A release must be a commit on main that has not been released before
      - name: Check the tag is new work on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          others="$(git tag --points-at "$GITHUB_SHA" --list 'v*' | grep -vxF "$GITHUB_REF_NAME" || true)"
          test -z "$others" \
            || { echo "::error::This commit is already released as $others"; exit 1; }

  api:
    name: API
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      check_public: true
    permissions:
      contents: read
      id-token: write # To sign in to Google with Workload Identity Federation

  record:
    name: Record the release
    needs: api
    runs-on: ubuntu-24.04 # Pinned; move to a newer image on purpose
    timeout-minutes: 5
    permissions:
      contents: write # To create the GitHub Release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="$(grep -E '^BUNDLE=' infra/deploy/app.env | cut -d= -f2-)"
          platform="$(grep -E '^ARG PROKOPTON_ML_VERSION=' Dockerfile | cut -d= -f2-)"
          title="$(grep -E '^title = ' prokopton.toml | cut -d'"' -f2)"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Serving bundle: \`$bundle\`. Platform: prokopton-ml $platform. Deployed and checked by the Release workflow."
